          type: string
          format: email
          title: Электронная почта
          maxLength: 254
        first_name:
          type: string
          title: Имя
          maxLength: 150
        last_name:
          type: string
          title: Фамилия
          maxLength: 150
        phone:
          type: string
          title: Телефон
          maxLength: 20
        city:
          type: string
          title: Город
          maxLength: 100
        avatar:
          type: string
          format: uri
          nullable: true
